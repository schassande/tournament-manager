<main class="registration-page">
  <p-card class="registration-card">
    <ng-template pTemplate="header">
      <div class="registration-header">
        <i class="pi pi-user-plus" aria-hidden="true"></i>
        <div>
          <h1>Create an account</h1>
        </div>
      </div>
    </ng-template>
    <div class="mode-switch" role="radiogroup" aria-label="Registration method">
      <label>
        <p-radioButton
          name="registrationMode"
          value="google"
          [ngModel]="mode()"
          (ngModelChange)="selectMode($event)"
          [disabled]="loading()"></p-radioButton>
        Google
      </label>
      <label>
        <p-radioButton
          name="registrationMode"
          value="password"
          [ngModel]="mode()"
          (ngModelChange)="selectMode($event)"
          [disabled]="loading()"></p-radioButton>
        Email and password
      </label>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-grid">
        @if (mode() === 'password') {
        <div class="field">
          <label for="firstName">First name *</label
          ><input id="firstName" pInputText formControlName="firstName" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="lastName">Last name *</label
          ><input id="lastName" pInputText formControlName="lastName" autocomplete="family-name" />
        </div>
        <div class="field">
          <label for="email">Email *</label
          ><input id="email" pInputText type="email" formControlName="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password *</label
          ><input id="password" pInputText type="password" formControlName="password" autocomplete="new-password" />
        </div>
        }
        <div class="field">
          <label for="country">Country *</label>
          <p-select
            [(ngModel)]="country"
            (ngModelChange)="countryChanged($event)"
            [options]="countries"
            optionLabel="name"
            [ngModelOptions]="{standalone: true}"
            placeholder="Select a country"
            [filter]="true"
            filterBy="label"
            appendTo="body"
            required>
          </p-select>
        </div>
        <div class="field">
          <label for="shortName">Short name</label
          ><input id="shortName" pInputText formControlName="shortName" autocomplete="nickname" />
        </div>
        <fieldset class="field gender-field">
          <legend>Gender *</legend>
          <div class="gender-options">
            <label><p-radioButton name="gender" value="M" formControlName="gender"></p-radioButton> Male</label
            ><label><p-radioButton name="gender" value="F" formControlName="gender"></p-radioButton> Female</label>
          </div>
        </fieldset>
      </div>
      @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
      }
      <button
        pButton
        type="submit"
        [label]="mode() === 'google' ? 'Register with google' : 'Register'"
        icon="pi pi-check"
        [loading]="loading()"
        [disabled]="loading()"></button>
    </form>
  </p-card>
</main>
